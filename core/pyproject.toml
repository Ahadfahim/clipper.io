[project]
name = "clipper-core"
version = "0.1.0"
description = "Clipper.io core: supervisor, agents, MCP tools, media engine, API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "websockets>=13",
  "sqlmodel>=0.0.22",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "pydantic>=2.9",
  "claude-agent-sdk>=0.2.163,<0.3",
  "mcp>=1.20",
  "httpx>=0.28",
  "keyring>=25",
  "tzdata>=2024.2",
  "anyio>=4.6",
  "tomli-w>=1.1",
]

[project.optional-dependencies]
faces = ["mediapipe>=1.0.1,<2"]  # MediaPipeFaceDetector (Windows; needs the BlazeFace model, see media/faces.py)

[project.scripts]
clipper = "clipper.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipper"]
