[project]
name = "clipper-bot"
version = "0.1.0"
description = "Clipper.io Discord bot (review flow, campaign cards, #control relay)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "discord.py>=2.4,<3",
  "httpx>=0.28",
  "websockets>=13",
  "pydantic>=2.9",
  "keyring>=25",
]

[project.scripts]
clipper-bot = "clipper_bot.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipper_bot"]
