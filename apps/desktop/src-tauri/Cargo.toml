[package]
name = "clipper-desktop"
version = "0.1.0"
description = "Clipper: agent-run clipping, installed Windows app"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "clipper_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["UI_ViewManagement", "Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
